<title>Support This Creator</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  font-family: Arial, sans-serif;
  color: #fff;
  text-align: center;
  background:
    radial-gradient(ellipse at top, #243b80 0%, transparent 55%),
    radial-gradient(ellipse at bottom, #641e79 0%, transparent 50%),
    linear-gradient(135deg, #080b18, #11152b, #090b18);
}

.card {
  width: 100%;
  max-width: 440px;
  padding: 38px 25px;
  border: 1px solid rgba(255,255,255,.18);
  border-radius: 25px;
  background: rgba(15,19,42,.82);
  box-shadow: 0 0 45px rgba(111,80,255,.22);
  backdrop-filter: blur(12px);
  animation: appear .7s ease-out;
}

.logo {
  font-size: 52px;
  margin-bottom: 16px;
  filter: drop-shadow(0 0 15px #9274ff);
}

h1 {
  font-size: clamp(27px, 7vw, 35px);
  line-height: 1.25;
  margin: 8px 0 15px;
}

h1 span {
  color: #a99aff;
}

p {
  color: #d0d5e8;
  line-height: 1.7;
  font-size: 16px;
}

.button {
  display: block;
  margin-top: 26px;
  padding: 17px 14px;
  border-radius: 13px;
  background: linear-gradient(100deg, #7255ff, #b14dff);
  color: white;
  text-decoration: none;
  font-weight: bold;
  font-size: 17px;
  box-shadow: 0 7px 25px rgba(139,82,255,.3);
  transition: transform .2s;
}

.button:hover {
  transform: translateY(-3px);
}

@keyframes appear {
  from {
    opacity: 0;
    transform: translateY(15px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@media (prefers-reduced-motion: reduce) {
  .card {
    animation: none;
  }
}
</style>
